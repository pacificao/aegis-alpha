name: Aegis CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q
  frontend:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/CHANGE_ME_GENERATE_A_RANDOM_VALUE/ci-only-random-value-000000000000/g' .env
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Create CI-only TLS fixture
        run: |
          sudo install -d -m 0755 /etc/letsencrypt/live/aegis-alpha.pacificao.com
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=aegis-alpha.pacificao.com" -keyout /etc/letsencrypt/live/aegis-alpha.pacificao.com/privkey.pem -out /etc/letsencrypt/live/aegis-alpha.pacificao.com/fullchain.pem
          sudo chgrp -R 101 /etc/letsencrypt
          sudo chmod 0750 /etc/letsencrypt /etc/letsencrypt/live /etc/letsencrypt/live/aegis-alpha.pacificao.com
          sudo chmod 0640 /etc/letsencrypt/live/aegis-alpha.pacificao.com/privkey.pem
      - run: docker compose up -d --wait
      - run: curl --fail http://127.0.0.1/health
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' --insecure --resolve aegis-alpha.pacificao.com:443:127.0.0.1 https://aegis-alpha.pacificao.com/api/status)" = 401
      - run: "! ss -ltn | grep -E ':(3000|5432|6379|8000)[[:space:]]'"
