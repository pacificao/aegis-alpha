name: Aegis CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Scan current tree and Git history
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 detect --source=/repo --no-banner --redact
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q tests
  gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash -n scripts/update-broker-gateway.sh scripts/install-broker-auto-update.sh
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: broker-gateway/requirements-dev.txt}
      - run: pip install -r broker-gateway/requirements-dev.txt
      - run: PYTHONPATH=broker-gateway pytest -q broker-gateway/tests

  frontend:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env && sed -i 's/CHANGE_ME_GENERATE_A_RANDOM_VALUE/ci-only-random-value-000000000000/g' .env
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Create CI-only TLS fixture
        run: |
          sudo install -d -m 0755 /etc/letsencrypt/live/aegis-alpha.pacificao.com
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=aegis-alpha.pacificao.com" -keyout /etc/letsencrypt/live/aegis-alpha.pacificao.com/privkey.pem -out /etc/letsencrypt/live/aegis-alpha.pacificao.com/fullchain.pem
          sudo chgrp -R 101 /etc/letsencrypt
          sudo chmod 0750 /etc/letsencrypt /etc/letsencrypt/live /etc/letsencrypt/live/aegis-alpha.pacificao.com
          sudo chmod 0640 /etc/letsencrypt/live/aegis-alpha.pacificao.com/privkey.pem
      - name: Create CI-only broker encryption fixture
        run: |
          sudo install -d -o 10001 -g 10001 -m 0700 /var/lib/aegis-broker-gateway
          sudo install -d -o root -g 10001 -m 0750 /etc/aegis
          openssl rand -base64 32 | tr "+/" "-_" | sudo tee /etc/aegis/broker-gateway.key >/dev/null
          sudo chown root:10001 /etc/aegis/broker-gateway.key
          sudo chmod 0440 /etc/aegis/broker-gateway.key
      - run: docker compose up -d --wait
      - run: curl --fail http://127.0.0.1/health
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' --insecure --resolve aegis-alpha.pacificao.com:443:127.0.0.1 https://aegis-alpha.pacificao.com/api/status)" = 401
      - run: "! ss -ltn | grep -E ':(3000|5432|6379|8000|8100)[[:space:]]'"
