name: aegis-alpha
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis_data:/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  broker-gateway:
    build: ./broker-gateway
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://aegis-alpha.pacificao.com}
      AEGIS_UI_URL: ${AEGIS_UI_URL:-https://aegis-alpha.pacificao.com}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-https://aegis-alpha.pacificao.com}
      BROKER_AUTHORIZATION_ENABLED: ${BROKER_AUTHORIZATION_ENABLED:-false}
      BROKER_EXECUTION_ENABLED: ${BROKER_EXECUTION_ENABLED:-false}
      BROKER_GATEWAY_SHARED_SECRET: ${BROKER_GATEWAY_SHARED_SECRET}
      BROKER_GATEWAY_DATA_DIR: /var/lib/aegis-broker
      BROKER_GATEWAY_KEY_FILE: /run/secrets/broker_key
    volumes:
      - ${BROKER_GATEWAY_DATA_DIR:-/var/lib/aegis-broker-gateway}:/var/lib/aegis-broker
      - ${BROKER_GATEWAY_KEY_FILE:-/etc/aegis/broker-gateway.key}:/run/secrets/broker_key:ro
    networks: [broker]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  backend:
    build: ./backend
    extra_hosts:
      - "brokerage.aegis-alpha.pacificao.com:${BROKER_GATEWAY_PRIVATE_IP:-10.124.0.4}"
    environment:
      AEGIS_ENV: ${AEGIS_ENV}
      AEGIS_VERSION: ${AEGIS_VERSION}
      AEGIS_TRADING_ENABLED: "false"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-1800}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS}
      PAM_BRIDGE_SOCKET: ${PAM_BRIDGE_SOCKET}
      AUTHORIZED_USER: ${AUTHORIZED_USER}
      ROBINHOOD_MCP_URL: ${ROBINHOOD_MCP_URL:-https://agent.robinhood.com/mcp/trading}
      ROBINHOOD_CONNECTION_CONFIGURED: ${ROBINHOOD_CONNECTION_CONFIGURED:-false}
      BROKER_GATEWAY_URL: ${BROKER_GATEWAY_URL:-https://brokerage.aegis-alpha.pacificao.com}
      BROKER_GATEWAY_SHARED_SECRET: ${BROKER_GATEWAY_SHARED_SECRET}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-Aegis Alpha admin@pacificao.com}
      DATA_CACHE_TTL_SECONDS: ${DATA_CACHE_TTL_SECONDS:-300}
      DEFAULT_MARKET_SYMBOLS: ${DEFAULT_MARKET_SYMBOLS:-SPY,QQQ,AAPL}
    volumes:
      - /run/aegis-auth:/run/aegis-auth
      - ./tests:/app/tests:ro
    networks: [edge, data, broker]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      broker-gateway: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    networks: [edge]
    depends_on: {backend: {condition: service_healthy}}
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  nginx:
    image: nginx:1.29.1-alpine
    user: "101:101"
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/lib/aegis-certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks: [edge, broker]
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
      broker-gateway: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

networks:
  edge:
  data: {internal: true}
  broker: {internal: true}
volumes:
  postgres_data:
  redis_data:
