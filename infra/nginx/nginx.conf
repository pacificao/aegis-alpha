worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format structured escape=json '{"time":"$time_iso8601","remote":"$remote_addr","request":"$request","status":$status,"bytes":$body_bytes_sent,"request_id":"$request_id"}';
  access_log /dev/stdout structured;
  error_log /dev/stderr warn;
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  upstream frontend { server frontend:3000; keepalive 16; }
  upstream backend { server backend:8000; keepalive 16; }
  upstream broker_gateway { server broker-gateway:8100; keepalive 4; }

  server {
    listen 8080;
    server_name aegis-alpha.pacificao.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://aegis-alpha.pacificao.com$request_uri; }
  }

  server {
    listen 8443 ssl;
    server_name aegis-alpha.pacificao.com;
    ssl_certificate /etc/letsencrypt/live/aegis-alpha.pacificao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aegis-alpha.pacificao.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health { limit_req zone=general burst=10 nodelay; proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location = /api/broker/robinhood/oauth/callback { limit_req zone=general burst=5 nodelay; proxy_pass http://broker_gateway; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location = /api/auth/login { limit_req zone=login burst=3 nodelay; proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto https; }
    location /api/ { limit_req zone=general burst=40 nodelay; proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-Proto https; }
    location / { limit_req zone=general burst=40 nodelay; proxy_pass http://frontend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto https; }
  }

  # Development fallback: direct IPv4 access remains available over HTTP.
  server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health { limit_req zone=general burst=10 nodelay; proxy_pass http://backend; proxy_set_header Host $host; }
    location / { return 301 https://aegis-alpha.pacificao.com$request_uri; }
  }
}
